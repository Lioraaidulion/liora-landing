<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f2e"/>
      <stop offset="1" stop-color="#1c1640"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#7c83f5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c83f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#e97aaa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e97aaa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dd9b"/>
      <stop offset="0.5" stop-color="#e7c873"/>
      <stop offset="1" stop-color="#c9a44f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c3ff"/>
      <stop offset="0.5" stop-color="#7c83f5"/>
      <stop offset="1" stop-color="#e7c873"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Lion emblem (brand row) -->
  <g transform="translate(80,70) scale(1.35)">
    <g fill="url(#gold)">
      <circle cx="20" cy="16" r="6"/><circle cx="44" cy="16" r="6"/>
      <circle cx="54.0" cy="33.0" r="7.6"/><circle cx="49.8" cy="45.9" r="7.6"/>
      <circle cx="38.8" cy="53.9" r="7.6"/><circle cx="25.2" cy="53.9" r="7.6"/>
      <circle cx="14.2" cy="45.9" r="7.6"/><circle cx="10.0" cy="33.0" r="7.6"/>
      <circle cx="14.2" cy="20.1" r="7.6"/><circle cx="25.2" cy="12.1" r="7.6"/>
      <circle cx="38.8" cy="12.1" r="7.6"/><circle cx="49.8" cy="20.1" r="7.6"/>
      <circle cx="32" cy="33" r="22"/>
    </g>
    <circle cx="32" cy="34" r="15.4" fill="#160f30"/>
    <circle cx="20" cy="16" r="2.6" fill="#160f30"/><circle cx="44" cy="16" r="2.6" fill="#160f30"/>
    <g fill="url(#gold)">
      <circle cx="26.2" cy="31" r="2.3"/><circle cx="37.8" cy="31" r="2.3"/>
      <circle cx="27.6" cy="41.5" r="3.6"/><circle cx="36.4" cy="41.5" r="3.6"/>
      <path d="M28.4 36.4 h7.2 l-3.6 4.4 z"/>
    </g>
  </g>
  <text x="188" y="128" font-family="'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" fill="#f3f2fb" letter-spacing="-1">Liora<tspan fill="#e7c873" font-size="26" dy="-16"> AI</tspan></text>

  <!-- Stars + audience -->
  <text x="82" y="250" font-family="Arial,sans-serif" font-size="26" fill="#e7c873" letter-spacing="4">★★★★★</text>
  <text x="230" y="250" font-family="'Helvetica Neue',Arial,sans-serif" font-size="24" fill="#b6b3d6">Cabinets dentaires &amp; de chirurgie esthétique</text>

  <!-- Headline -->
  <text x="80" y="360" font-family="'Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" fill="#f3f2fb" letter-spacing="-2">Ne laissez <tspan fill="url(#grad)">plus jamais</tspan></text>
  <text x="80" y="448" font-family="'Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" fill="#f3f2fb" letter-spacing="-2">un patient sans réponse.</text>

  <!-- Sub -->
  <text x="82" y="540" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" fill="#b6b3d6">Réceptionniste téléphonique IA — répond 24h/24, prend vos rendez-vous.</text>

  <!-- accent bar -->
  <rect x="82" y="566" width="120" height="4" rx="2" fill="url(#grad)"/>
</svg>
